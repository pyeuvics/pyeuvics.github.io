name: Site validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate public artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out website source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-docs.txt
            requirements-notebooks.txt
            sources.lock.yml

      - name: Install pinned validation environment
        run: python -m pip install -r requirements-docs.txt -r requirements-notebooks.txt

      - name: Validate website source without private credentials
        run: |
          python -m pytest
          python -m mypy --strict \
            tools/site_assembly \
            tools/assemble_site.py \
            tools/ci_source_locks.py \
            tools/source_update.py \
            tools/validate_ci.py
          python -m mkdocs build --strict
