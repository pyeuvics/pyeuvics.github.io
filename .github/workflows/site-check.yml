name: Site validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate website source
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out website source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up website validation
        uses: ./.github/actions/setup-validation

      - name: Validate website source without private credentials
        run: python -m tools.quality --output .staging/source-check --bind

      - name: Set up browser test runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Install pinned browser test tools
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Verify public synthetic pages in Chromium
        run: npm run test:browser
