name: Set up website validation
description: Install the reviewed Python environment without source access or credentials
runs:
  using: composite
  steps:
    - name: Set up Python 3.13
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: "3.13"
        cache: pip
        cache-dependency-path: |
          constraints-validation.txt
          requirements-validation.txt
          requirements-docs.txt
          requirements-notebooks.txt
          sources.lock.yml
    - name: Install pinned validation environment
      shell: bash
      run: python -m pip install -r requirements-validation.txt
