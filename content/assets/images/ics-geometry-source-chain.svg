<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900"
     role="img" aria-labelledby="ics-title ics-desc">
  <title id="ics-title">Inverse Compton scattering geometry and EUVICS source chain</title>
  <desc id="ics-desc">An electron bunch travels from left to right through an interaction point. A laser pulse approaches the point from the lower right, and alpha is the angle between the electron and laser propagation vectors. A dashed horizontal laser arrow shows the head-on limit, alpha equals 180 degrees. Scattered extreme ultraviolet radiation forms a narrow forward cone. Theta is measured from the electron forward direction to an observed ray. Wider dashed boundaries show a separate collection acceptance leading to an optic. The electron beam continues to a dump. A source-chain strip appears below. The drawing is not to scale.</desc>

  <defs>
    <marker id="arrow-electron" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a4300"/>
    </marker>
    <marker id="arrow-laser" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b3fa0"/>
    </marker>
    <marker id="arrow-euv" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00717a"/>
    </marker>
    <marker id="arrow-axis" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
    <style>
      .label { font: 600 19px system-ui, sans-serif; fill: #17212b; paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; }
      .small { font: 500 16px system-ui, sans-serif; fill: #17212b; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
      .note { font: 700 18px system-ui, sans-serif; fill: #17212b; }
      .electron { stroke: #8a4300; stroke-width: 9; fill: none; }
      .laser { stroke: #6b3fa0; stroke-width: 8; stroke-dasharray: 18 10; fill: none; }
      .euv { stroke: #00717a; stroke-width: 5; fill: none; }
      .axis { stroke: #4b5563; stroke-width: 2.5; stroke-dasharray: 3 8; fill: none; }
      .acceptance { stroke: #9a3412; stroke-width: 3; stroke-dasharray: 12 9; fill: none; }
      .angle { stroke: #17212b; stroke-width: 3; fill: none; }
      .chain-box { fill: #f8fafc; stroke: #52606d; stroke-width: 2; rx: 8; }
      .chain-text { font: 600 15px system-ui, sans-serif; fill: #17212b; text-anchor: middle; }
    </style>
  </defs>

  <rect x="4" y="4" width="1192" height="892" rx="12"
        fill="#fff" stroke="#52606d" stroke-width="2"/>
  <text x="38" y="42" class="note">SCHEMATIC — NOT TO SCALE</text>
  <text x="1160" y="42" class="small" text-anchor="end">Angles shown in the laboratory frame</text>

  <!-- Electron propagation direction and bunch. -->
  <line x1="78" y1="330" x2="1095" y2="330" class="axis"
        marker-end="url(#arrow-axis)"/>
  <line x1="115" y1="330" x2="505" y2="330" class="electron"
        marker-end="url(#arrow-electron)"/>
  <ellipse cx="170" cy="330" rx="47" ry="24" fill="#f4c78d" stroke="#8a4300" stroke-width="3"/>
  <ellipse cx="145" cy="330" rx="8" ry="17" fill="#fff" stroke="#8a4300" stroke-width="2"/>
  <ellipse cx="170" cy="330" rx="8" ry="17" fill="#fff" stroke="#8a4300" stroke-width="2"/>
  <ellipse cx="195" cy="330" rx="8" ry="17" fill="#fff" stroke="#8a4300" stroke-width="2"/>
  <text x="105" y="286" class="label">electron bunch</text>
  <text x="270" y="360" class="small">solid line</text>

  <!-- Interaction point. -->
  <circle cx="520" cy="330" r="13" fill="#fff" stroke="#17212b" stroke-width="4"/>
  <circle cx="520" cy="330" r="4" fill="#17212b"/>
  <text x="493" y="292" class="label" text-anchor="middle">interaction point</text>

  <!-- Incident laser and collision-angle convention. -->
  <line x1="930" y1="567" x2="531" y2="337" class="laser"
        marker-end="url(#arrow-laser)"/>
  <path d="M 903 548 C 925 525, 944 544, 924 567 C 902 590, 881 572, 903 548 z"
        fill="#e8d8f5" stroke="#6b3fa0" stroke-width="3"/>
  <text x="858" y="604" class="label">incident laser pulse</text>
  <text x="823" y="628" class="small">dashed propagation line</text>

  <path d="M 614 330 A 94 94 0 0 0 439 283" class="angle"/>
  <text x="510" y="217" class="label" text-anchor="middle">α</text>
  <text x="510" y="241" class="small" text-anchor="middle">between electron and laser propagation vectors</text>

  <!-- Explicit, unambiguous head-on reference: laser travels right to left. -->
  <line x1="790" y1="116" x2="635" y2="116" class="laser"
        marker-end="url(#arrow-laser)"/>
  <line x1="635" y1="116" x2="790" y2="116" class="axis"
        marker-end="url(#arrow-axis)"/>
  <text x="712" y="85" class="label" text-anchor="middle">head-on limit: α = 180°</text>
  <text x="712" y="148" class="small" text-anchor="middle">opposite propagation vectors on one line</text>

  <!-- Physical forward emission and a representative observed ray. -->
  <path d="M 520 330 L 974 272 A 458 458 0 0 1 974 388 Z"
        fill="#c9f1f2" fill-opacity="0.75" stroke="none"/>
  <line x1="520" y1="330" x2="972" y2="272" class="euv"/>
  <line x1="520" y1="330" x2="972" y2="388" class="euv"/>
  <line x1="520" y1="330" x2="955" y2="294" class="euv"
        marker-end="url(#arrow-euv)"/>
  <text x="745" y="252" class="label">forward EUV emission</text>
  <text x="745" y="276" class="small">physical angular distribution (stylized)</text>

  <path d="M 612 330 A 92 92 0 0 0 611 322" class="angle"/>
  <text x="637" y="315" class="label">θ</text>

  <!-- Instrument collection acceptance, distinct from physical emission. -->
  <line x1="520" y1="330" x2="1018" y2="238" class="acceptance"/>
  <line x1="520" y1="330" x2="1018" y2="422" class="acceptance"/>
  <path d="M 1018 238 Q 970 330 1018 422" fill="none" stroke="#9a3412" stroke-width="9"/>
  <text x="1008" y="184" class="label" text-anchor="end">collection acceptance</text>
  <text x="1008" y="208" class="small" text-anchor="end">dash-dot boundaries; instrument setting</text>
  <text x="1018" y="500" class="small" text-anchor="middle">EUV collection optic</text>

  <!-- Downstream electron path and dump. -->
  <line x1="535" y1="330" x2="1105" y2="330" class="electron"
        marker-end="url(#arrow-electron)"/>
  <rect x="1110" y="295" width="42" height="70" rx="5" fill="#e5e7eb" stroke="#17212b" stroke-width="3"/>
  <path d="M 1118 305 L 1144 321 M 1118 321 L 1144 337 M 1118 337 L 1144 353"
        stroke="#17212b" stroke-width="3"/>
  <text x="1128" y="389" class="small" text-anchor="middle">electron dump</text>
  <text x="1080" y="309" class="small" text-anchor="end">electron forward direction / θ = 0° reference</text>
  <text x="250" y="440" class="small"><tspan x="250">observation angle θ is measured from</tspan><tspan x="250" dy="23">the electron forward direction</tspan></text>

  <!-- Compact source-chain view. -->
  <line x1="82" y1="742" x2="1118" y2="742" class="axis" marker-end="url(#arrow-axis)"/>
  <rect x="58" y="700" width="155" height="62" class="chain-box"/>
  <text x="135" y="725" class="chain-text"><tspan x="135">electron source</tspan><tspan x="135" dy="20">and accelerator</tspan></text>
  <rect x="250" y="700" width="155" height="62" class="chain-box"/>
  <text x="327" y="725" class="chain-text"><tspan x="327">electron transport</tspan><tspan x="327" dy="20">and focus</tspan></text>
  <rect x="442" y="700" width="155" height="62" class="chain-box"/>
  <text x="519" y="725" class="chain-text"><tspan x="519">interaction</tspan><tspan x="519" dy="20">point</tspan></text>
  <rect x="634" y="700" width="155" height="62" class="chain-box"/>
  <text x="711" y="725" class="chain-text"><tspan x="711">EUV collection</tspan><tspan x="711" dy="20">and transport</tspan></text>
  <rect x="826" y="700" width="155" height="62" class="chain-box"/>
  <text x="903" y="725" class="chain-text"><tspan x="903">spectral analysis</tspan><tspan x="903" dy="20">and detection</tspan></text>
  <path d="M 670 842 L 610 800 L 520 766" class="laser" marker-end="url(#arrow-laser)"/>
  <text x="700" y="835" class="small">timed laser transport enters at the interaction point</text>

  <text x="38" y="878" class="small">Original EUVICS website schematic; physics conventions follow the locked pyEUVICS documentation.</text>
</svg>
