site_name: EUVICS Documentation
site_description: Public documentation portal for approved EUVICS and pyEUVICS material
site_url: https://pyeuvics.github.io/
repo_url: https://github.com/pyeuvics/pyeuvics.github.io
repo_name: pyeuvics/pyeuvics.github.io
edit_uri: edit/main/content/
docs_dir: content
site_dir: site
use_directory_urls: true
strict: true
theme:
  name: material
  custom_dir: overrides
  language: en
  features: [navigation.sections, navigation.path, navigation.top, navigation.footer, search.highlight, search.suggest, content.action.edit, content.code.copy]
  palette:
    scheme: default
    primary: blue
    accent: blue
nav:
  - Home: index.md
  - Project:
      - Overview: project/overview.md
      - Design status: project/design-status.md
  - Documents:
      - EUVICS Proposal: documents/proposal.md
      - Conceptual Design Report (CDR): documents/cdr.md
  - pyEUVICS:
      - Installation: software/installation.md
      - Science and conventions: software/science.md
      - API reference: software/api.md
      - Tutorials: software/tutorials.md
      - Static notebooks: software/notebooks/index.md
      - Workflows: software/workflows.md
      - Validation: software/validation.md
  - Reference campaigns:
      - 6.7 nm campaign: campaigns/6-7-nm.md
      - 13.5 nm campaign: campaigns/13-5-nm.md
  - Downloads: downloads/index.md
  - About: about/index.md
plugins: [search]
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.arithmatex: {generic: true}
  - pymdownx.details
  - pymdownx.superfences
extra_css:
  - stylesheets/readthedocs.css
extra_javascript:
  - javascripts/mathjax.js
  - javascripts/navigation.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
copyright: Website structure is MIT-licensed; imported material retains its source license and attribution.
