site_name: EUVICS Documentation
site_description: Public documentation portal for approved EUVICS and pyEUVICS material
site_url: https://chongshikpark.github.io/euvics.github.io/
repo_url: https://github.com/chongshikpark/euvics.github.io
repo_name: chongshikpark/euvics.github.io
edit_uri: edit/main/content/
docs_dir: content
site_dir: site
use_directory_urls: true
strict: true
theme:
  name: material
  custom_dir: overrides
  language: en
  features: [navigation.sections, navigation.top, navigation.footer, search.highlight, search.suggest, content.action.edit]
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle: {icon: material/brightness-7, name: Use dark color scheme}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: light blue
      toggle: {icon: material/brightness-4, name: Use light color scheme}
nav:
  - Home: index.md
  - Project:
      - Overview: project/overview.md
      - Design status: project/design-status.md
  - Documents:
      - EUVICS Proposal: documents/proposal.md
      - Conceptual Design Report (CDR): documents/cdr.md
  - pyEUVICS:
      - Installation: software/installation.md
      - Science and conventions: software/science.md
      - API reference: software/api.md
      - Tutorials: software/tutorials.md
      - Workflows: software/workflows.md
      - Validation: software/validation.md
  - Reference campaigns:
      - 6.7 nm campaign: campaigns/6-7-nm.md
      - 13.5 nm campaign: campaigns/13-5-nm.md
  - Downloads: downloads/index.md
  - About: about/index.md
plugins: [search]
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.arithmatex: {generic: true}
  - pymdownx.details
  - pymdownx.superfences
extra_css: [stylesheets/extra.css]
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
copyright: Website structure is MIT-licensed; imported material retains its source license and attribution.
